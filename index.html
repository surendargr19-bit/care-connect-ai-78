<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CareConnect AI</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf2f0;--surf:#fff;--ink:#10262b;--mute:#52696c;--line:#cfdcd9;--pri:#0f6b66;--priInk:#fff;--water:#1769c2;--food:#b86a00;--med:#6a4fb3;--emg:#c62828;--oth:#4b6270;--ok:#1b7a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1c;--surf:#16282b;--ink:#e8f1f0;--mute:#9bb2b4;--line:#2a4043;--pri:#3fb8ae;--priInk:#06201e;--water:#5aa5f0;--food:#f0a43a;--med:#a794ec;--emg:#ef6a6a;--oth:#8fb0c2;--ok:#5fd486}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.4 "Atkinson Hyperlegible",system-ui,"Noto Sans Tamil",sans-serif;min-height:100vh}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surf);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:20px;margin:0}
nav,.langs{display:flex;gap:6px}
nav a,.langs button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
nav a.on,.langs button.on{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.bar label{color:var(--mute);font-size:15px}
.bar select{font:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink)}
.help{display:block;margin:6vh auto 0;width:min(78vw,300px);aspect-ratio:1;border-radius:50%;border:0;background:var(--pri);color:var(--priInk);font:700 26px/1.2 inherit;font-family:inherit;cursor:pointer;box-shadow:0 0 0 14px color-mix(in srgb,var(--pri) 22%,transparent);padding:20px}
.help:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;min-height:150px;border:0;border-radius:18px;color:#fff;font:700 22px/1.2 inherit;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px}
.tile .e{font-size:54px;line-height:1}
.tile.emg{grid-column:1/-1;min-height:130px}
.tile .tag{position:absolute;top:8px;right:8px;background:#fff;color:#10262b;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.t-water{background:#1769c2}.t-food{background:#a65f00}.t-medicine{background:#6a4fb3}.t-emergency{background:#c62828}.t-other{background:#4b6270}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center}
.panel .e{font-size:72px}
.panel h2{font-size:28px;margin:8px 0 20px}
.row{display:flex;gap:12px}
.row button{flex:1;min-height:76px;font:700 24px inherit;font-family:inherit;border-radius:16px;border:0;cursor:pointer}
.yes{background:var(--ok);color:#fff}.no{background:transparent;border:2px solid var(--line)!important;color:var(--ink)}
.status{font-size:24px;font-weight:700}
.ghost{margin-top:16px;font:inherit;font-size:16px;background:none;border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:999px;cursor:pointer}
.mic{margin-top:18px}
.stats{display:flex;gap:12px;margin-bottom:16px}
.stats div{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stats b{font-size:28px;display:block}
.req{background:var(--surf);border:1px solid var(--line);border-left:8px solid var(--oth);border-radius:14px;padding:14px;margin-bottom:12px}
.req.emergency{border-left-color:var(--emg);background:color-mix(in srgb,var(--emg) 10%,var(--surf))}
.req.medicine{border-left-color:var(--med)}.req.water{border-left-color:var(--water)}.req.food{border-left-color:var(--food)}
.req h3{margin:0;font-size:22px}
.req .meta{color:var(--mute);font-size:15px}
.ai{margin:8px 0 0;font-size:15px;background:color-mix(in srgb,var(--pri) 12%,transparent);padding:6px 10px;border-radius:8px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{font:700 16px inherit;font-family:inherit;padding:10px 16px;border-radius:10px;border:0;cursor:pointer;background:var(--pri);color:var(--priInk)}
.acts button.alt{background:var(--ok);color:#fff}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
@media (prefers-reduced-motion:no-preference){.req.emergency.new{animation:fl 1s 3}@keyframes fl{50%{background:var(--emg);color:#fff}}}
.scan{border-radius:24px;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;text-align:center;padding:20px;cursor:pointer;user-select:none;touch-action:manipulation}.scan .e{font-size:110px;line-height:1}.scan .q{font:700 34px/1.2 inherit;font-family:inherit}.scan .hint{font-size:16px;opacity:.92}.pbar{width:80%;height:10px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:#fff;animation:fill 5s linear forwards}@keyframes fill{from{width:0}to{width:100%}}
</style>
</head>
<body>
<header>
  <h1>CareConnect AI <small id="live" style="font-size:13px;color:var(--mute);font-weight:400"></small></h1>
  <nav aria-label="View"><a href="#patient" id="n-patient">Patient</a><a href="#nurse" id="n-nurse">Nurse</a></nav>
</header>
<main id="app"></main>
<script>
const L={
 en:{press:"Press for help",ask:"What do you need?",q:x=>"Do you need "+x+"?",yes:"Yes",no:"No",sent:"The nurse has been told",coming:"The nurse is coming",done:"Request completed",again:"New request",back:"Back",likely:"Likely now",speak:"Speak",listen:"Listening…",bed:"Bed",
  water:"Water",food:"Food",medicine:"Medicine",emergency:"Emergency",other:"Other"},
 ta:{press:"உதவிக்கு அழுத்தவும்",ask:"உங்களுக்கு என்ன வேண்டும்?",q:x=>x+" வேண்டுமா?",yes:"ஆம்",no:"இல்லை",sent:"செவிலியருக்கு தெரிவிக்கப்பட்டது",coming:"செவிலியர் வருகிறார்",done:"கோரிக்கை முடிந்தது",again:"புதிய கோரிக்கை",back:"பின்",likely:"இப்போது",speak:"பேசுங்கள்",listen:"கேட்கிறேன்…",bed:"படுக்கை",
  water:"தண்ணீர்",food:"உணவு",medicine:"மருந்து",emergency:"அவசரம்",other:"மற்றவை"},
 tg:{press:"Udhavikku azhuthavum",ask:"Ungalukku enna venum?",q:x=>x+" venuma?",yes:"Aam",no:"Illai",sent:"Nurse-ku therivikkapattadhu",coming:"Nurse varugiraar",done:"Request mudinjadhu",again:"Pudhu request",back:"Back",likely:"Ippo",speak:"Pesunga",listen:"Ketkiren…",bed:"Bed",
  water:"Thanneer",food:"Unavu",medicine:"Marundhu",emergency:"Avasaram",other:"Matravai"}
};
const EMO={water:"💧",food:"🍚",medicine:"💊",emergency:"🚨",other:"🙋"};
const PRI={emergency:0,medicine:1,water:2,food:2,other:3};
const KW={water:["water","thanni","thanneer","தண்ணீர்","தண்ணி"],food:["food","hungry","sapad","saapad","unavu","உணவு","சாப்பாடு","பசி"],medicine:["medicine","tablet","marundhu","மருந்து","மாத்திரை"],emergency:["help","emergency","pain","avasaram","அவசரம்","வலி","உதவி"]};
const KEY="cc_requests";
let mem=[],lang="en",bed="101",step="home",pick=null,sentId=null,seen=null,listening=false;
const ORDER=["water","food","medicine","emergency","other"];
const HINT={en:"Press the button to select · Hold 2 s = Emergency",ta:"தேர்வு செய்ய பட்டனை அழுத்தவும் · 2 நொடி பிடித்தால் அவசரம்",tg:"Select panna button-a azhuthunga · 2 sec pidichaa Avasaram"};
let scanIdx=0,scanT=null,scanStart=0,rounds=0,holdT=null;
function startScan(){step="scan";scanIdx=0;rounds=0;scanStart=Date.now();clearInterval(scanT);
  scanT=setInterval(()=>{scanIdx=(scanIdx+1)%ORDER.length;scanStart=Date.now();if(scanIdx===0&&++rounds>=2)step="home";render()},5000);render()}
function stopScan(){clearInterval(scanT);scanT=null}
function choose(){if(step!=="scan")return;const k=ORDER[scanIdx];stopScan();pick=k;send(k)}
function pressDown(){if(step==="home"){startScan();return}
  if(step==="scan"&&!holdT)holdT=setTimeout(()=>{holdT=null;stopScan();pick="emergency";send("emergency")},2000)}
function pressUp(){if(holdT){clearTimeout(holdT);holdT=null;choose()}}

let DB=null,first=true;
function load(){if(!DB){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v)mem=v}catch(e){}}return mem}
function save(a){mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function send(type){
  const id=Date.now()+"-"+Math.random().toString(36).slice(2,6);
  const r={id,bed,type,t:Date.now(),status:"new"};
  if(DB){mem=[...mem,r];DB.collection("requests").doc(id).set(r).catch(()=>{})}else save([...load(),r]);
  sentId=id;step="sent";render();
}
function patch(id,p){
  mem=mem.map(r=>r.id===id?{...r,...p}:r);
  if(DB)DB.collection("requests").doc(id).update(p).catch(()=>{});else save(mem);
  render();
}
function clearAll(){
  if(DB)mem.forEach(r=>DB.collection("requests").doc(r.id).delete().catch(()=>{}));
  mem=[];if(!DB)save([]);render();
}
function likelyType(){const h=new Date().getHours();return (h>=7&&h<9)||(h>=12&&h<14)||(h>=19&&h<21)?"food":null}
function ago(t){const m=Math.floor((Date.now()-t)/60000);return m<1?"just now":m+" min ago"}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.4)}catch(e){}}

function patient(){
  const t=L[lang];
  const top=`<div class="bar"><div class="langs" role="group" aria-label="Language">${[["en","English"],["ta","தமிழ்"],["tg","Tanglish"]].map(([k,n])=>`<button data-lang="${k}" class="${lang===k?"on":""}">${n}</button>`).join("")}</div>
  <label>${t.bed} <select id="bed">${["101","102","103","104","105"].map(b=>`<option${b===bed?" selected":""}>${b}</option>`).join("")}</select></label></div>`;
  if(step==="scan"){const k=ORDER[scanIdx],el=((Date.now()-scanStart)/1000).toFixed(2);
    return `<div class="scan t-${k}" id="card" role="button" tabindex="0" aria-label="${t[k]}"><div class="e">${EMO[k]}</div><div class="q">${t.q(t[k])}</div><div class="hint">${HINT[lang]}</div><div class="pbar"><i style="animation-delay:-${el}s"></i></div></div>
    <div style="text-align:center"><button class="ghost" id="cancel">${t.back}</button></div>`}
  if(step==="home")return top+`<button class="help" id="go">${t.press}</button>
    <div style="text-align:center"><button class="ghost mic" id="mic">🎤 ${listening?t.listen:t.speak}</button></div>`;
  if(step==="pick"){const lk=likelyType();
    const tile=k=>`<button class="tile t-${k}${k==="emergency"?" emg":""}" data-pick="${k}"><span class="e">${EMO[k]}</span>${t[k]}${k===lk?`<span class="tag">${t.likely}</span>`:""}</button>`;
    return top+`<h2 style="text-align:center;margin:0 0 14px">${t.ask}</h2><div class="grid">${["water","food","medicine","other"].map(tile).join("")}${tile("emergency")}</div>
    <div style="text-align:center"><button class="ghost" id="back">${t.back}</button></div>`}
  if(step==="confirm")return top+`<div class="panel"><div class="e">${EMO[pick]}</div><h2>${t.q(t[pick])}</h2>
    <div class="row"><button class="yes" id="yes">${t.yes}</button><button class="no" id="no">${t.no}</button></div></div>`;
  const r=load().find(x=>x.id===sentId);const st=r?r.status:"new";
  const msg=st==="accepted"?t.coming:st==="done"?t.done:t.sent;
  return top+`<div class="panel"><div class="e">${st==="done"?"✅":st==="accepted"?"🏃":"📨"}</div><div class="status" role="status">${msg}</div>
    <p style="color:var(--mute)">${t[r?r.type:"other"]} · ${t.bed} ${bed}</p><button class="ghost" id="again">${t.again}</button></div>`;
}

function nurse(){
  const all=load().filter(r=>r.status!=="done").sort((a,b)=>PRI[a.type]-PRI[b.type]||a.t-b.t);
  const emg=all.filter(r=>r.type==="emergency").length;
  const cards=all.map(r=>{
    const rep=load().filter(x=>x.bed===r.bed&&x.type===r.type&&Date.now()-x.t<1800000).length;
    const note=r.type==="emergency"?"AI priority: urgent, respond now":rep>1?`AI note: asked ${rep} times in 30 min, check on the patient`:"AI priority: routine request";
    return `<div class="req ${r.type}${Date.now()-r.t<6000?" new":""}"><h3>${EMO[r.type]} ${L.en[r.type]}, Bed ${r.bed}</h3>
    <div class="meta">${ago(r.t)} · ${r.status==="accepted"?"Accepted":"Waiting"}</div><div class="ai">${note}</div>
    <div class="acts">${r.status==="new"?`<button data-acc="${r.id}">Accept</button>`:""}<button class="alt" data-done="${r.id}">Mark done</button></div></div>`}).join("");
  return `<div class="stats"><div><b>${all.length}</b>Open requests</div><div><b>${emg}</b>Emergencies</div></div>
  ${cards||`<div class="empty">No open requests. New ones appear here instantly.</div>`}
  <div style="text-align:center"><button class="ghost" id="clear">Clear all (demo)</button></div>`;
}

function render(){
  const v=location.hash==="#nurse"?"nurse":"patient";
  if(v==="nurse"&&step==="scan")step="home";
  if(step!=="scan")stopScan();
  document.getElementById("live").textContent=DB?"Live sync on":"Offline demo";
  document.getElementById("n-patient").className=v==="patient"?"on":"";
  document.getElementById("n-nurse").className=v==="nurse"?"on":"";
  if(v==="nurse"){
    const ids=load().map(r=>r.id);
    if(seen){load().filter(r=>r.type==="emergency"&&!seen.includes(r.id)&&r.status==="new").forEach(()=>beep())}
    seen=ids;
  }
  document.getElementById("app").innerHTML=v==="nurse"?nurse():patient();
  wire(v);
}
function wire(v){
  const $=s=>document.querySelector(s),all=s=>document.querySelectorAll(s);
  if(v==="nurse"){
    all("[data-acc]").forEach(b=>b.onclick=()=>patch(b.dataset.acc,{status:"accepted"}));
    all("[data-done]").forEach(b=>b.onclick=()=>patch(b.dataset.done,{status:"done"}));
    const c=$("#clear");if(c)c.onclick=clearAll;return;
  }
  all("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});
  const bs=$("#bed");if(bs)bs.onchange=()=>{bed=bs.value};
  const go=$("#go");if(go)go.onclick=startScan;
  const cd=$("#card");if(cd){cd.onpointerdown=pressDown;cd.onpointerup=pressUp}
  const cn=$("#cancel");if(cn)cn.onclick=()=>{step="home";render()};
  const bk=$("#back");if(bk)bk.onclick=()=>{step="home";render()};
  all("[data-pick]").forEach(b=>b.onclick=()=>{pick=b.dataset.pick;if(pick==="emergency")send(pick);else{step="confirm";render()}});
  const y=$("#yes");if(y)y.onclick=()=>send(pick);
  const n=$("#no");if(n)n.onclick=()=>{step="pick";render()};
  const ag=$("#again");if(ag)ag.onclick=()=>{step="home";sentId=null;render()};
  const mic=$("#mic");if(mic)mic.onclick=listen;
}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Voice input is not supported in this browser. Use the buttons instead.");return}
  const rec=new SR();rec.lang=lang==="ta"?"ta-IN":"en-IN";listening=true;render();
  rec.onresult=e=>{
    const said=e.results[0][0].transcript.toLowerCase();
    const hit=Object.keys(KW).find(k=>KW[k].some(w=>said.includes(w)));
    listening=false;
    if(hit){pick=hit;if(hit==="emergency")send(hit);else{step="confirm";render()}}else{step="pick";render()}
  };
  rec.onerror=rec.onend=()=>{if(listening){listening=false;render()}};
  try{rec.start()}catch(e){listening=false;render()}
}
window.addEventListener("hashchange",render);
const scanning=()=>step==="home"||step==="scan";
addEventListener("keydown",e=>{
  if(e.code!=="Space"&&e.code!=="Enter")return;
  if(location.hash==="#nurse"||!scanning()||/^(SELECT|INPUT)$/.test((e.target&&e.target.tagName)||""))return;
  e.preventDefault();if(!e.repeat)pressDown();
});
addEventListener("keyup",e=>{
  if(e.code!=="Space"&&e.code!=="Enter")return;
  if(location.hash==="#nurse"||(!scanning()&&!holdT))return;
  e.preventDefault();pressUp();
});
window.addEventListener("storage",e=>{if(e.key===KEY){load();render()}});
setInterval(()=>{if(location.hash==="#nurse"||step==="sent"){load();render()}},4000);
load();render();
try{
  if(window.claude)claude.use("db").then(db=>{
    if(!db)return;DB=db;
    db.collection("requests").onSnapshot(s=>{
      mem=s.docs.map(d=>({...d.data(),id:d.id}));
      if(first){seen=mem.map(r=>r.id);first=false}
      render();
    },()=>{});
  }).catch(()=>{});
}catch(e){}
</script>
</body>
</html>
